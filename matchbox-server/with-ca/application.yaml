logging:
  level:
    root: INFO
    ca.uhn.fhir.jpa.term: DEBUG
    org.hl7.fhir.r5.terminologies: DEBUG
    org.apache.http.wire: TRACE
    org.apache.http: TRACE
server:
  servlet:
    context-path: /matchboxv3
spring:
  datasource:
    url: "jdbc:postgresql://ps-ca-hapi-fhir-db-dev.ccq3yll5qome.ca-central-1.rds.amazonaws.com:5432/matchbox-v4"
    username: matchbox
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
matchbox:
  fhir:
    context:
      extensions: any
      fhirVersion: 4.0.1
      txServer: https://terminologystandardsservice.ca/tx/fhir
      txServerCache: true
      onlyOneEngine: false
      suppressError:
        hl7.fhir.r4.core#4.0.1:
          - "Extension_EXT_Unknown_NotHere@^.*extension.*"
      suppressWarnInfo:
        ca.infoway.io.erec:
          - "Constraint failed: dom-6:"
          - "regex:URL value '(.+)' does not resolve"
          - "regex:ValueSet '(.+)' not found"
          - "regex:This element does not match any known slice defined in the profile (.*)"
          - "regex:Reference to draft CodeSystem (.+)"
        ca.infoway.io.psca:
          - "Constraint failed: dom-6:"
          - "regex:URL value '(.+)' does not resolve"
          - "regex:ValueSet '(.+)' not found"
          - "regex:This element does not match any known slice defined in the profile (.*)"
          - "regex:Reference to draft CodeSystem (.+)"
          - "Best Practice Recommendation: In general, all observations should have a performer"
          - "Best Practice Recommendation: In general, all observations should have an effective[x] ()"
          - "regex:Validate Observation against (.+)"
          - "regex:Can't find '(.+)' in the bundle"
          - "regex:UCUM Codes that contain human readable annotations like (.+) can be misleading (.e.g. they are ignored when comparing units).(.+)"
          - "regex:A definition for the value Set '(.+)' could not be found"
          - "UNABLE_TO_CHECK_IF_THE_PROVIDED_CODES_ARE_IN_THE_VALUE_SET"
          - "regex:No definition could be found for URL value '(.+)'"
          - "regex:Reference to draft ValueSet (.+)"
        ca.ab.fhir.psab:
          - "Constraint failed: dom-6:"
          - "regex:URL value '(.+)' does not resolve"
          - "regex:ValueSet '(.+)' not found"
          - "regex:This element does not match any known slice defined in the profile (.*)"
          - "regex:Reference to draft CodeSystem (.+)"
          - "Best Practice Recommendation: In general, all observations should have a performer"
          - "Best Practice Recommendation: In general, all observations should have an effective[x] ()"
          - "regex:Validate Observation against (.+)"
          - "regex:Can't find '(.+)' in the bundle"
          - "regex:UCUM Codes that contain human readable annotations like (.+) can be misleading (.e.g. they are ignored when comparing units).(.+)"
          - "regex:A definition for the value Set '(.+)' could not be found"
          - "UNABLE_TO_CHECK_IF_THE_PROVIDED_CODES_ARE_IN_THE_VALUE_SET"
          - "regex:No definition could be found for URL value '(.+)'"
          - "regex:Reference to draft ValueSet (.+)"
        ca.on.oh.patient-summary:
          - "Constraint failed: dom-6:"
          - "regex:URL value '(.+)' does not resolve"
          - "regex:ValueSet '(.+)' not found"
          - "regex:This element does not match any known slice defined in the profile (.*)"
          - "regex:Reference to draft CodeSystem (.+)"
          - "regex:A definition for CodeSystem '(.+)' could not be found, so the code cannot be validated"
          - "Best Practice Recommendation: In general, all observations should have a performer"
          - "Best Practice Recommendation: In general, all observations should have an effective[x] ()"
          - "regex:Validate Observation against (.+)"
          - "regex:Can't find '(.+)' in the bundle"
          - "regex:UCUM Codes that contain human readable annotations like (.+) can be misleading (.e.g. they are ignored when comparing units).(.+)"
          - "regex:A definition for the value Set '(.+)' could not be found"
          - "UNABLE_TO_CHECK_IF_THE_PROVIDED_CODES_ARE_IN_THE_VALUE_SET"
      httpReadOnly: true
